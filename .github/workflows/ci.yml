name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync environment (project + dev tools)
        run: uv sync --dev --python ${{ matrix.python-version }}

      - name: Byte-compile sources
        run: uv run --python ${{ matrix.python-version }} python -m py_compile trustwatch/*.py

      - name: Run tests
        # No camera or display is available on the runner; the suite is
        # designed to pass with tests that need hardware skipped.
        run: uv run --python ${{ matrix.python-version }} pytest -q
