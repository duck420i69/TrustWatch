[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "trustwatch"
version = "0.1.0"
description = "Local intrusion and tamper monitor for your own laptop."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "opencv-python>=4.8",
    "mss>=9.0",
    "requests>=2.28",
]

[project.optional-dependencies]
desktop = ["plyer>=2.1"]
screenshots = ["Pillow>=10.0"]
winproc = ["psutil>=5.9"]
yaml = ["pyyaml>=6.0"]

[project.scripts]
trustwatch = "trustwatch.cli:main"

# Managed with uv (https://docs.astral.sh/uv/). Common commands:
#   uv sync            # create .venv and install the project + dev tools
#   uv run trustwatch  # run the CLI inside the managed environment
#   uv run pytest      # run the test suite
[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["trustwatch"]
